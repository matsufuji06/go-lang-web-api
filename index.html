<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8" />
	<title>YouTube データAPI デモ</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
	<!-- Header -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
		<div class="container">
			<a class="navbar-brand fw-bold" href="#">YouTube TrendHub</a>
		</div>
	</nav>

	<!-- Main Content -->
	<main class="container my-5">

		<!-- Intro Section -->
		<section class="mb-5">
			<h1 class="mb-3">YouTube TrendHub</h1>
			<p class="text-muted">
				最新動画のタイムラインやトレンド分析、チャンネル探索など、多彩な機能を提供します。
			</p>
		</section>

		<!-- Search Section -->
		<section class="card mb-4 shadow-sm">
			<div class="card-body">
				<form id="searchForm" class="row g-2">
					<div class="col-md-9">
						<input type="text" class="form-control" id="keyword" placeholder="検索キーワード（例：筋トレ、Golang）" />
					</div>
					<div class="col-md-3 d-grid">
						<button class="btn btn-danger" type="submit">検索</button>
					</div>
				</form>
			</div>
		</section>

		<!-- Timeline Section -->
		<section>
			<h4 class="mb-3">🕒 最新動画タイムライン</h4>
			<div id="timeline" class="row gy-4">
				<!-- 動画カードをここに動的に追加 -->
				<div class="col-md-6 col-lg-4">
					<div class="card h-100 shadow-sm">
						<img src="https://via.placeholder.com/480x270" class="card-img-top" alt="動画サムネイル">
						<div class="card-body">
							<h5 class="card-title">動画タイトル</h5>
							<p class="card-text text-muted">チャンネル名</p>
							<p class="card-text small text-muted">公開日時: 2025-12-19</p>
							<span class="badge bg-success">NEW</span>
						</div>
					</div>
				</div>
				<!-- 他の動画カードも同様に追加 -->
			</div>
		</section>
	</main>

	<!-- Footer -->
	<footer class="bg-dark text-white py-3">
		<div class="container text-center">
			<h5 class="mb-1">YouTube TrendHub</h5>
			<p class="mb-0">最新動画、トレンド分析、チャンネル探索など、多彩な機能を提供します。</p>
			<p class="mb-0">Powered by YouTube Data API v3</p>
		</div>
	</footer>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
